<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Preview</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; color: #eee; }
  canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; right: 12px; max-width: 360px; background: rgba(12,13,16,.78); backdrop-filter: blur(8px); border-radius: 12px; padding: 12px 14px; box-sizing: border-box; }
  #panel h1 { font-size: 15px; margin: 0 0 2px; }
  #panel p { margin: 0 0 10px; color: #aab; font-size: 12px; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0; }
  select, input[type=range] { flex: 1; max-width: 200px; }
  select { background: #1c1e24; color: #eee; border: 1px solid #333; border-radius: 6px; padding: 4px; }
  #stats { position: fixed; bottom: 12px; left: 12px; font: 12px ui-monospace, monospace; color: #9fb; background: rgba(0,0,0,.5); padding: 6px 8px; border-radius: 6px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; background: rgba(0,0,0,.6); }
  #loading[hidden] { display: none; }
  .row { display: flex; gap: 6px; }
  button { flex: 1; background: #e31937; color: #fff; border: 0; border-radius: 6px; padding: 7px; font-weight: 600; }
  button.alt { background: #2a2d35; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="panel">
  <h1 id="title">World preview</h1>
  <p id="desc"></p>
  <label>World <select id="world"></select></label>
  <label>Mode <select id="mode"><option value="flight">Flight</option><option value="ground">Ground</option><option value="hop">Hop</option></select></label>
  <label>Quality <select id="quality"><option>low</option><option>medium</option><option selected>high</option><option>ultra</option></select></label>
  <label>Time <input id="time" type="range" min="0" max="24" step="0.1"></label>
  <label>Weather <select id="weather"></select></label>
  <label>Tour speed <input id="speed" type="range" min="0" max="90" step="1" value="35"></label>
  <div class="row"><button id="cam">Chase cam</button><button id="hide" class="alt">Hide panel</button></div>
</div>
<div id="stats"></div>
<div id="loading">Building world…</div>
<script type="module">
import * as THREE from 'three';
import { WORLDS, createWorld } from './src/worlds/index.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.2, 6000);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Placeholder car: a low red wedge, so ground following is visible.
const car = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.75, 4.1), new THREE.MeshStandardMaterial({ color: 0xc8102e, metalness: 0.6, roughness: 0.3 }));
body.position.y = 0.6;
body.castShadow = true;
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.45, 1.8), new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.1 }));
cabin.position.set(0, 1.15, -0.3);
cabin.castShadow = true;
car.add(body, cabin);
car.rotation.order = 'YXZ';
scene.add(car);

const params = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
for (const w of WORLDS) $('world').add(new Option(`${w.order + 1}. ${w.name} (${w.location})`, w.id));
$('world').value = params.get('world') || WORLDS[0].id;
$('quality').value = params.get('quality') || 'high';
$('mode').value = params.get('mode') || 'flight';

let world = null;
let dist = 0;
let chase = true;
const info = {};

let hopGroup = null;
function build() {
  $('loading').hidden = false;
  setTimeout(() => {
    if (world) world.dispose();
    const id = $('world').value;
    const meta = WORLDS.find((w) => w.id === id);
    const t0 = performance.now();
    const q = $('quality').value;
    renderer.shadowMap.enabled = q !== 'low';
    world = createWorld(id, {
      scene, renderer, quality: q, mode: $('mode').value,
      timeOfDay: params.has('time') ? +params.get('time') : meta.defaultTime,
      weather: params.get('weather') || meta.defaultWeather,
    });
    const ms = performance.now() - t0;
    $('title').textContent = `${meta.name}`;
    const fl = world.mode === 'flight';
    const par = fl ? meta.flight.par : meta.par;
    $('desc').textContent = `${meta.description} ${fl ? Math.round(world.flightLength) + ' m flight course, ' + world.rings.length + ' rings, ' + world.colliders.length + ' colliders' : meta.lengthMeters + ' m lap'}, ${world.laps} laps, gravity ${meta.gravity} m/s², gold ${par.gold}s. Built in ${ms.toFixed(0)} ms.`;
    $('mode').value = $('mode').value === 'hop' && world.mode === 'ground' ? 'hop' : world.mode;
    // Hop rings over the gaps (the game draws its own; these are a preview).
    if (hopGroup) scene.remove(hopGroup);
    hopGroup = new THREE.Group();
    if (!fl) {
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x36e0ff, toneMapped: false });
      for (const r of world.hopRings) {
        const m = new THREE.Mesh(new THREE.TorusGeometry(r.radius, 0.35, 8, 32), ringMat);
        m.position.copy(r.position);
        if (r.normal) m.lookAt(r.position.clone().add(r.normal));
        hopGroup.add(m);
      }
    }
    scene.add(hopGroup);
    $('time').value = world.timeOfDay;
    $('weather').innerHTML = '';
    for (const w of world.weathers) $('weather').add(new Option(w, w));
    $('weather').value = world.weather;
    dist = 0;
    $('loading').hidden = true;
    window.__world = world;
  }, 30);
}
$('world').onchange = build;
$('quality').onchange = build;
$('mode').onchange = build;
$('time').oninput = (e) => world.setTimeOfDay(+e.target.value);
$('weather').onchange = (e) => world.setWeather(e.target.value);
$('cam').onclick = () => { chase = !chase; $('cam').textContent = chase ? 'Chase cam' : 'Drone cam'; };
$('hide').onclick = () => { $('panel').hidden = true; setTimeout(() => ($('panel').hidden = false), 8000); };
build();

const clock = new THREE.Clock();
let frames = 0, acc = 0, fps = 0;
const look = new THREE.Vector3();
const fwd = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!world) return;
  const speed = +$('speed').value;
  const fl = world.mode === 'flight';
  const curve = fl ? world.flightCurve : world.trackCurve;
  const L = fl ? world.flightLength : world.trackLength;
  dist = (dist + speed * (fl ? 1.8 : 1) * dt) % L;
  const t = dist / L;
  const p = curve.getPointAt(t);
  curve.getTangentAt(t, fwd);
  let x = p.x, z = p.z;
  if (fl) {
    car.position.copy(p);
    // Light up the next ring ahead of the car.
    const next = world.rings.findIndex((r) => r.t > t);
    if (next !== window.__next) { window.__next = next; world.setNextRing(next < 0 ? world.rings.length : next); }
  } else {
    // Drive a gentle racing line weave.
    const ti = world.getTrackInfo(p.x, p.z, -1, info);
    const lat = Math.sin(dist * 0.01) * world.roadHalfWidth * 0.4;
    x = p.x + ti.right[0] * lat;
    z = p.z + ti.right[2] * lat;
    // Sail over gaps along the curve instead of dropping in.
    car.position.set(x, ti.gap ? p.y : world.getGroundHeight(x, z), z);
  }
  car.rotation.y = Math.atan2(fwd.x, fwd.z);
  car.rotation.x = -Math.asin(Math.max(-1, Math.min(1, fwd.y)));

  if (chase) {
    camera.position.set(x - fwd.x * 9, car.position.y + 3.2, z - fwd.z * 9);
    const gy = world.getGroundHeight(camera.position.x, camera.position.z) + 1;
    if (camera.position.y < gy) camera.position.y = gy;
    look.set(x + fwd.x * 6, car.position.y + 1.2, z + fwd.z * 6);
  } else {
    const a = performance.now() * 0.00005;
    camera.position.set(x + Math.cos(a) * 140, car.position.y + 70, z + Math.sin(a) * 140);
    look.copy(car.position);
  }
  camera.lookAt(look);
  world.update(dt, car.position, camera);
  renderer.render(scene, camera);

  frames++; acc += dt;
  if (acc > 0.5) {
    fps = frames / acc; frames = 0; acc = 0;
    const r = renderer.info.render;
    $('stats').textContent = `${fps.toFixed(0)} fps · ${r.calls} draws · ${(r.triangles / 1000).toFixed(0)}k tris · ${world.getSurface(x, z).type} grip ${world.getSurface(x, z).grip.toFixed(2)}`;
  }
}
frame();
</script>
</body>
</html>
