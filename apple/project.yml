# Xcode project for the Apple apps. Generate it with XcodeGen (brew install xcodegen):
#   cd apple && xcodegen generate && open Roadster.xcodeproj
name: Roadster
options:
  bundleIdPrefix: app.roadsterrush
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
    tvOS: "16.0"
    watchOS: "9.0"
    visionOS: "1.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # set your Apple Developer team id here (or in Xcode)
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  # The full game: iPhone, iPad, Mac and Apple Vision Pro from one target.
  Roadster:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: App
      - path: Web
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Sync web game
        script: '"$SRCROOT/scripts/sync-web.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Roadster Rush
        LSApplicationCategoryType: public.app-category.racing-games
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers: [{ ProfileName: ExtendedGamepad }]
        ITSAppUsesNonExemptEncryption: false
        NSMotionUsageDescription: Tilt your device to bank the flying Roadster.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roadsterrush.game
        TARGETED_DEVICE_FAMILY: "1,2,7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xros*]": AppIconVision
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Roadster.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
    scheme: {}

  # Apple TV: a native mini-game for the Siri Remote.
  SkyRings:
    type: application
    platform: tvOS
    sources: [TV]
    info:
      path: TV/Info.plist
      properties:
        CFBundleDisplayName: Sky Rings
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers: [{ ProfileName: MicroGamepad }, { ProfileName: ExtendedGamepad }]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roadsterrush.skyrings
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  # Apple Watch: a standalone one-thumb mini-game (Digital Crown + tap).
  RingDash:
    type: application
    platform: watchOS
    sources: [Watch]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Ring Dash
        WKApplication: true
        WKWatchOnly: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roadsterrush.ringdash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
